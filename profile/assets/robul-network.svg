<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">How CircuitBreakers fits into RobUL</title>
  <desc id="desc">Four regional robotics teams feed a regional selection team, RobUL FRC Team 9585. CircuitBreakers is the Litoměřice team.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="20" fill="#0d1117"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="355" y="48" width="390" height="110" rx="18" fill="url(#top)" stroke="#f7c948" stroke-width="3"/>
    <text x="550" y="92" text-anchor="middle" fill="#f0f6fc" font-size="30" font-weight="800">RobUL • FRC #9585</text>
    <text x="550" y="126" text-anchor="middle" fill="#8b949e" font-size="17">regional selection team for international FRC competition</text>
    <path d="M550 158v62" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="566" y="196" fill="#8b949e" font-size="14">selection from regional teams</text>

    <g transform="translate(54 268)">
      <rect width="225" height="128" rx="16" fill="#111827" stroke="#30363d" stroke-width="2"/>
      <text x="112.5" y="46" text-anchor="middle" fill="#f0f6fc" font-size="23" font-weight="750">CHOBOT</text>
      <text x="112.5" y="78" text-anchor="middle" fill="#8b949e" font-size="15">Chomutov</text>
      <text x="112.5" y="103" text-anchor="middle" fill="#8b949e" font-size="13">regional team</text>
    </g>

    <g transform="translate(310 268)">
      <rect width="225" height="128" rx="16" fill="#111827" stroke="#30363d" stroke-width="2"/>
      <text x="112.5" y="46" text-anchor="middle" fill="#f0f6fc" font-size="23" font-weight="750">PaperBox</text>
      <text x="112.5" y="78" text-anchor="middle" fill="#8b949e" font-size="15">Štětí</text>
      <text x="112.5" y="103" text-anchor="middle" fill="#8b949e" font-size="13">regional team</text>
    </g>

    <g transform="translate(566 268)">
      <rect width="225" height="128" rx="16" fill="#111827" stroke="#30363d" stroke-width="2"/>
      <text x="112.5" y="46" text-anchor="middle" fill="#f0f6fc" font-size="23" font-weight="750">LEDbot</text>
      <text x="112.5" y="78" text-anchor="middle" fill="#8b949e" font-size="15">Ústí nad Labem</text>
      <text x="112.5" y="103" text-anchor="middle" fill="#8b949e" font-size="13">regional team</text>
    </g>

    <g transform="translate(822 268)">
      <rect width="225" height="128" rx="16" fill="#142238" stroke="#55d6ff" stroke-width="4"/>
      <text x="112.5" y="44" text-anchor="middle" fill="#f0f6fc" font-size="21" font-weight="800">CircuitBreakers</text>
      <text x="112.5" y="78" text-anchor="middle" fill="#55d6ff" font-size="15" font-weight="700">Litoměřice</text>
      <text x="112.5" y="103" text-anchor="middle" fill="#8b949e" font-size="13">regional team • this org</text>
    </g>

    <path d="M166 268C166 225 430 226 500 219" stroke="#8b949e" stroke-width="2.5" fill="none"/>
    <path d="M422 268C422 238 498 233 530 219" stroke="#8b949e" stroke-width="2.5" fill="none"/>
    <path d="M678 268C678 238 602 233 570 219" stroke="#8b949e" stroke-width="2.5" fill="none"/>
    <path d="M934 268C934 225 670 226 600 219" stroke="#55d6ff" stroke-width="3" fill="none"/>

    <text x="550" y="455" text-anchor="middle" fill="#f0f6fc" font-size="19" font-weight="700">Regional teams build locally. Selected students join RobUL for FRC.</text>
    <text x="550" y="485" text-anchor="middle" fill="#8b949e" font-size="14">Structure documented by RobUL / UJEP for the 2025–2026 season.</text>
