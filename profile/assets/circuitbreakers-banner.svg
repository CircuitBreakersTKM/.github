<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">CircuitBreakers</title>
  <desc id="desc">CircuitBreakers, the Litoměřice regional robotics team in the RobUL program.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55d6ff"/>
      <stop offset="100%" stop-color="#f7c948"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="22" fill="url(#bg)"/>
  <rect x="56" y="44" width="10" height="152" rx="5" fill="url(#accent)"/>

  <text x="96" y="98"
        fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="50"
        font-weight="700">
    CircuitBreakers
  </text>

  <text x="96" y="138"
        fill="#b1bac4"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23">
    Litoměřice • Czechia
  </text>

  <text x="96" y="178"
        fill="#55d6ff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="600">
    Regional robotics team in the RobUL program • FRC Team 9585
  </text>
</svg>